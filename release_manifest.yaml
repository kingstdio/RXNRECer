version: 1
include:
  - .bumpversion.cfg
  - .gitignore
  - README.md
  - LICENSE
  - pyproject.toml
  - MANIFEST.in
  - Makefile
  - release_manifest.yaml
  - setup_scm_example.py
  - version.py
  - rxnrecer
  - docs/INSTALL.md
  - docs/LLM_API_SETUP.md
  - docs/RELEASE_NOTES.md
  - docs/RELEASE_WORKFLOW.md
  - docs/WEB_API_DEPLOYMENT.md
  - ckpt/README.md
  - data/README.md
  - examples
  - results/README.md
  - results/.gitkeep
  - results/cache/.gitkeep
  - results/sample/.gitkeep
  - extools/msa/README.md
  - scripts/prepare_release_tree.py
  - scripts/release.py
  - scripts/sync_versions.py
  - scripts/update_docs.py
  - scripts/version_manager.py
exclude:
  - paper
  - paper/.history
  - paper/AI辅助工作区
  - baselines
  - benchmarks
  - preprocessing
  - logs
  - sessions
  - temp
  - training
  - tests
  - scripts/internal
  - scripts/legacy
  - scripts/preprocess
  - scripts/structure
  - scripts/case
  - docs/SESSION_NOTES_2026-04-22.md
  - docs/WORKLOG.md
  - docs/MIGRATION_JOBS.md
  - docs/INTERACTION_DICTIONARY_FLOW.md
prune_globs:
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/*.pyo"
  - "**/.ipynb_checkpoints/**"
  - "**/.history/**"
  - ".vscode/**"
required_files:
  - version.py
  - setup_scm_example.py
  - README.md
  - pyproject.toml
  - rxnrecer/__init__.py
  - rxnrecer/cli/predict.py
  - docs/INSTALL.md
  - docs/LLM_API_SETUP.md
  - docs/RELEASE_WORKFLOW.md
